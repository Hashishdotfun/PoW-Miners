name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-cpu-miner:
    name: Build CPU Miner (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: node18-win-x64
            label: Windows
            ext: .exe
            suffix: win-x64
          - target: node18-linux-x64
            label: Linux
            ext: ""
            suffix: linux-x64
          - target: node18-macos-x64
            label: macOS
            ext: ""
            suffix: macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Compile TypeScript
        run: npx tsc standard-miner/continuous-miner.ts --outDir dist --esModuleInterop --resolveJsonModule --module commonjs --target es2020 --skipLibCheck

      - name: Inline IDL
        run: |
          node -e "
          const fs = require('fs');
          const idl = fs.readFileSync('target/idl/pow_protocol.json', 'utf-8').trim();
          let js = fs.readFileSync('dist/continuous-miner.js', 'utf-8');
          js = js.replace(
            /const idlPath = .*pow_protocol\.json.*;\n\s*const idl = .*readFileSync\(idlPath.*;\n/,
            'const idl = ' + idl + ';\n'
          );
          fs.writeFileSync('dist/continuous-miner.js', js);
          if (js.includes('idlPath')) { console.error('IDL not inlined'); process.exit(1); }
          console.log('IDL inlined');
          "

      - name: Package binary
        run: pkg dist/continuous-miner.js --targets ${{ matrix.target }} --output hashish-cpu-miner-${{ matrix.suffix }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: cpu-miner-${{ matrix.suffix }}
          path: hashish-cpu-miner-${{ matrix.suffix }}${{ matrix.ext }}

  build-gpu-orchestrator:
    name: Build GPU Orchestrator (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: node18-win-x64
            label: Windows
            ext: .exe
            suffix: win-x64
          - target: node18-linux-x64
            label: Linux
            ext: ""
            suffix: linux-x64
          - target: node18-macos-x64
            label: macOS
            ext: ""
            suffix: macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Compile TypeScript
        run: npx tsc standard-miner/continuous-gpu-miner.ts --outDir dist --esModuleInterop --resolveJsonModule --module commonjs --target es2020 --skipLibCheck

      - name: Inline IDL
        run: |
          node -e "
          const fs = require('fs');
          const idl = fs.readFileSync('target/idl/pow_protocol.json', 'utf-8').trim();
          let js = fs.readFileSync('dist/continuous-gpu-miner.js', 'utf-8');
          js = js.replace(
            /const idlPath = .*pow_protocol\.json.*;\n\s*const idl = .*readFileSync\(idlPath.*;\n/,
            'const idl = ' + idl + ';\n'
          );
          fs.writeFileSync('dist/continuous-gpu-miner.js', js);
          console.log('IDL inlined');
          "

      - name: Package binary
        run: pkg dist/continuous-gpu-miner.js --targets ${{ matrix.target }} --output hashish-gpu-orchestrator-${{ matrix.suffix }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-orchestrator-${{ matrix.suffix }}
          path: hashish-gpu-orchestrator-${{ matrix.suffix }}${{ matrix.ext }}

  build-gpu-binary-windows:
    name: Build GPU Binary (Windows + CUDA)
    runs-on: windows-latest
    env:
      VCPKGRS_DYNAMIC: 1
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenSSL via vcpkg
        run: |
          vcpkg install openssl:x64-windows
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV

      - uses: Jimver/cuda-toolkit@v0.2.18
        with:
          cuda: '12.5.0'
          method: 'network'

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile CUDA kernel
        run: nvcc gpu-miner/kernels/sha256_mining.cu --ptx -o gpu-miner/kernels/sha256_mining.ptx -O3 --use_fast_math

      - name: Build GPU miner
        run: cargo build --release --features cuda
        working-directory: gpu-miner

      - name: Rename binary
        run: copy gpu-miner\target\release\miner.exe hashish-gpu-miner-win-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-miner-win-x64
          path: hashish-gpu-miner-win-x64.exe

  build-gpu-binary-linux:
    name: Build GPU Binary (Linux + CUDA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Jimver/cuda-toolkit@v0.2.18
        with:
          cuda: '12.5.0'
          method: 'network'

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile CUDA kernel
        run: nvcc gpu-miner/kernels/sha256_mining.cu --ptx -o gpu-miner/kernels/sha256_mining.ptx -O3 --use_fast_math

      - name: Build GPU miner
        run: cargo build --release --features cuda
        working-directory: gpu-miner

      - name: Rename binary
        run: cp gpu-miner/target/release/miner hashish-gpu-miner-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-miner-linux-x64
          path: hashish-gpu-miner-linux-x64

  create-release:
    name: Create Release
    needs: [build-cpu-miner, build-gpu-binary-windows, build-gpu-binary-linux, build-gpu-orchestrator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cpu-miner-win-x64/hashish-cpu-miner-win-x64.exe
            artifacts/cpu-miner-linux-x64/hashish-cpu-miner-linux-x64
            artifacts/cpu-miner-macos-x64/hashish-cpu-miner-macos-x64
            artifacts/gpu-miner-win-x64/hashish-gpu-miner-win-x64.exe
            artifacts/gpu-miner-linux-x64/hashish-gpu-miner-linux-x64
            artifacts/gpu-orchestrator-win-x64/hashish-gpu-orchestrator-win-x64.exe
            artifacts/gpu-orchestrator-linux-x64/hashish-gpu-orchestrator-linux-x64
            artifacts/gpu-orchestrator-macos-x64/hashish-gpu-orchestrator-macos-x64
            miner-config.example.json
          body: |
            ## Hashish Miner

            ### CPU Miner (simple)
            | Platform | File |
            |----------|------|
            | Windows | `hashish-cpu-miner-win-x64.exe` |
            | Linux | `hashish-cpu-miner-linux-x64` |
            | macOS | `hashish-cpu-miner-macos-x64` |

            1. Download the CPU miner for your platform + `miner-config.example.json`
            2. Rename config to `miner-config.json`, set your `wallet_path`
            3. Run the binary

            ### GPU Miner (NVIDIA CUDA)
            | Platform | Files needed |
            |----------|-------------|
            | Windows | `hashish-gpu-orchestrator-win-x64.exe` + `hashish-gpu-miner-win-x64.exe` |
            | Linux | `hashish-gpu-orchestrator-linux-x64` + `hashish-gpu-miner-linux-x64` |

            1. Download both GPU files for your platform + `miner-config.example.json`
            2. Put all files in the same folder
            3. Rename config to `miner-config.json`, set your `wallet_path`
            4. Run the orchestrator binary

            > GPU miner requires NVIDIA GPU with CUDA drivers installed.
            > macOS GPU miner is not available (no CUDA support on macOS).

            ### Wallet format
            - **Solana CLI**: JSON array `[12,34,56,...]`
            - **Phantom export**: base58 private key string
